<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Invitation 💖</title>
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            /* Dynamic animated gradient background */
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ffc3a0, #ffafbd);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2d3436;
            overflow: hidden; /* Prevent scrolling to keep the runaway button in bounds */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Container */
        .container {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 3rem 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 107, 129, 0.2), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.4);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #ff4757;
            font-size: 2.4rem;
            margin-bottom: 2rem;
            line-height: 1.3;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: #ff4757;
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #ff6b81;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="date"], select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid transparent;
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            color: #2d3436;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            appearance: none; /* Clean up default dropdowns */
        }

        input[type="date"]:hover, select:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 107, 129, 0.1);
        }

        input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #ff6b81;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255, 107, 129, 0.15);
            transform: translateY(-2px);
        }

        /* Buttons */
        .buttons-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 2.5rem;
            position: relative;
        }

        .btn {
            padding: 14px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Pulsing animation for primary actions */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 129, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(255, 107, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 129, 0); }
        }

        .btn-primary, .yes-btn {
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
            animation: pulse 2.5s infinite;
        }

        .btn-primary {
            width: 100%;
            margin-top: 1.5rem;
        }

        .btn-primary:hover, .yes-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 129, 0.5);
            background: linear-gradient(135deg, #ff798d, #ff5e6d);
            animation: none; /* Pause pulse on hover */
        }

        .yes-btn {
            flex-grow: 1;
        }

        .no-btn {
            background-color: rgba(255, 255, 255, 0.8);
            color: #747d8c;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            flex-grow: 1;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.5);
        }

        /* Floating Hearts Background Elements */
        .heart {
            position: fixed;
            font-size: 1.5rem;
            color: rgba(255, 107, 129, 0.6);
            animation: float linear infinite;
            z-index: 1;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* Step Visibility & Smooth Transitions */
        .step {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Success Message styling */
        #summaryText {
            font-size: 1.25rem;
            line-height: 1.8;
            background: rgba(255, 255, 255, 0.7);
            padding: 1.8rem;
            border-radius: 20px;
            color: #2d3436;
            border: 2px dashed rgba(255, 107, 129, 0.5);
            margin-top: 1rem;
        }
        
        .highlight {
            color: #ff4757;
            font-weight: 700;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- STEP 1: Initial Question -->
        <div id="step1" class="step active">
            <h1>Hey Priya, would you like to go out for a lovely meal with me? 🥺❤️</h1>
            <div class="buttons-row">
                <button type="button" id="yesBtn" class="btn yes-btn">Yes, I'd love to! 💖</button>
                <button type="button" id="noBtn" class="btn no-btn">No</button>
            </div>
        </div>

        <!-- STEP 2: The Details Form -->
        <div id="step2" class="step">
            <h2>Yay! Let's plan it! 🎉</h2>
            <form id="dateForm">
                <div class="form-group">
                    <label for="datePicker">When are you free?</label>
                    <input type="date" id="datePicker" required>
                </div>
                
                <div class="form-group">
                    <label for="location">Where should we go?</label>
                    <select id="location" required>
                        <option value="" disabled selected>Select a romantic spot</option>
                        <option value="Oshiwara Cafe">Oshiwara Cafe ☕</option>
                        <option value="Andheri Lokhandwala">Andheri Lokhandwala 🛍️</option>
                        <option value="Juhu Beach">Juhu Beach 🏖️</option>
                        <option value="Powai Lake">Powai Lake 🦢</option>
                        <option value="Surprise Me!">Surprise Me! 🎁</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="food">What should we eat?</label>
                    <select id="food" required>
                        <option value="" disabled selected>Select pure veg food</option>
                        <option value="Italian (Pizza & Pasta)">Italian (Pizza & Pasta) 🍕</option>
                        <option value="North Indian (Paneer Tikka, Dal Makhani)">North Indian (Paneer Tikka, Dal Makhani) 🥘</option>
                        <option value="Mumbai Street Food (Pav Bhaji/Chaat)">Mumbai Street Food (Pav Bhaji/Chaat) 😋</option>
                        <option value="South Indian">South Indian 🥥</option>
                        <option value="Just Coffee & Desserts">Just Coffee & Desserts 🍰</option>
                    </select>
                </div>
                
                <button type="button" id="confirmBtn" class="btn btn-primary">Confirm Our Date! 🥰</button>
            </form>
        </div>

        <!-- STEP 3: Celebration Message -->
        <div id="step3" class="step">
            <h2>It's a Date! 🎉</h2>
            <p id="summaryText"></p>
        </div>
    </div>

    <!-- Canvas Confetti Library for Celebration Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        // DOM Elements
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');

        // Background floating hearts logic
        function createHearts() {
            const heartsContainer = document.createElement('div');
            heartsContainer.style.position = 'fixed';
            heartsContainer.style.top = '0';
            heartsContainer.style.left = '0';
            heartsContainer.style.width = '100vw';
            heartsContainer.style.height = '100vh';
            heartsContainer.style.pointerEvents = 'none';
            heartsContainer.style.zIndex = '1';
            document.body.appendChild(heartsContainer);

            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                // Random heart variants
                const heartSymbols = ['❤️', '💖', '✨', '💕'];
                heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                heart.style.fontSize = (Math.random() * 1.2 + 0.8) + 'rem';
                
                heartsContainer.appendChild(heart);

                // Clean up heart after animation ends
                setTimeout(() => {
                    heart.remove();
                }, 8000);
            }, 400); // create a new heart every 400ms
        }
        createHearts();

        // Function to move the "No" button randomly
        const moveNoButton = () => {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const btnRect = noBtn.getBoundingClientRect();
            
            // Safety padding so button stays fully visible
            const maxX = windowWidth - btnRect.width - 30;
            const maxY = windowHeight - btnRect.height - 30;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            // Using absolute positioning relative to body for smoother runaway
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            // Add a little spin for extra fun
            noBtn.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
        };

        // Attach event listeners to make the "No" button run away
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveNoButton();
        }, {passive: false});
        noBtn.addEventListener('click', moveNoButton);

        // Transition utility function
        function switchStep(hideStep, showStep) {
            hideStep.style.opacity = '0';
            hideStep.style.transform = 'translateY(-20px)';
            
            setTimeout(() => {
                hideStep.classList.remove('active');
                hideStep.style.display = 'none';
                
                showStep.style.display = 'block';
                // Trigger reflow
                void showStep.offsetWidth; 
                
                showStep.classList.add('active');
                showStep.style.opacity = '1';
                showStep.style.transform = 'translateY(0)';
            }, 400);
        }

        // Handle Yes click
        yesBtn.addEventListener('click', () => {
            switchStep(step1, step2);
        });

        // Handle Confirm Button Click (Step 2 to Step 3)
        confirmBtn.addEventListener('click', () => {
            const datePicker = document.getElementById('datePicker');
            const locationSelect = document.getElementById('location');
            const foodSelect = document.getElementById('food');
            
            const date = datePicker.value;
            const location = locationSelect.options[locationSelect.selectedIndex]?.text;
            const food = foodSelect.options[foodSelect.selectedIndex]?.text;
            
            if (!date || !locationSelect.value || !foodSelect.value) {
                alert("Please pick a date, location, and food first! 🥰");
                return;
            }
            
            const dateObj = new Date(date);
            const formattedDate = dateObj.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            
            // Clean up emojis from string for a cleaner read in the summary
            const cleanLoc = location.replace(/[^\w\s]/gi, '').trim();
            const cleanFood = food.replace(/[^\w\s\(\)&,]/gi, '').trim();

            switchStep(step2, step3);
            
            // Update summary text
            const summaryText = document.getElementById('summaryText');
            summaryText.innerHTML = `It's fixed! See you on <span class="highlight">${formattedDate}</span> at <span class="highlight">${cleanLoc}</span> for some delicious <span class="highlight">${cleanFood}</span>! Can't wait! ❤️`;
            
            // Trigger Confetti
            setTimeout(fireConfetti, 500);
        });

        // Huge Celebration Confetti logic
        function fireConfetti() {
            var duration = 8000; // 8 seconds of massive confetti
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 40, spread: 360, ticks: 100, zIndex: 100 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 80 * (timeLeft / duration);
              
              // Explode from random points in the upper half
              confetti(Object.assign({}, defaults, { 
                  particleCount, 
                  origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                  colors: ['#ff9a9e', '#fecfef', '#ff6b81', '#ffc3a0', '#ffffff']
              }));
              confetti(Object.assign({}, defaults, { 
                  particleCount, 
                  origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                  colors: ['#ff9a9e', '#fecfef', '#ff6b81', '#ffc3a0', '#ffffff']
              }));
              // Massive center burst
              confetti(Object.assign({}, defaults, { 
                  particleCount: particleCount * 1.5, 
                  spread: 120,
                  startVelocity: 60,
                  origin: { x: 0.5, y: 0.5 }, 
                  colors: ['#ff4757', '#ff6b81', '#ffffff'] 
              }));
            }, 250);
        }
    </script>
</body>
</html>
